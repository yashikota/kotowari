version: "3"

vars:
  SERVE_ADDR: 127.0.0.1:7730

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task -l

  # --- runtime ---

  serve:
    desc: Start kotowari in background (embedded SPA + API)
    cmds:
      - task: _run
        vars: { CLI: 'serve --addr {{.SERVE_ADDR}}' }

  stop:
    desc: Stop background kotowari
    cmds:
      - task: _run
        vars: { CLI: stop }

  serve:fg:
    desc: Foreground serve with embedded SPA (no Vite)
    cmds:
      - task: _run
        vars: { CLI: 'serve --fg --addr {{.SERVE_ADDR}}' }

  dev:
    desc: Dev mode — API + Vite HMR (open the Vite URL in your browser)
    deps: [dev:api, dev:web]

  dev:api:
    desc: "API on {{.SERVE_ADDR}} (foreground, strict port for Vite proxy)"
    cmds:
      - task: _run
        vars: { CLI: 'serve --fg --strict-port --addr {{.SERVE_ADDR}}' }

  dev:web:
    desc: Vite dev server (proxies /api to {{.SERVE_ADDR}})
    dir: web
    cmds:
      - pnpm exec vp dev

  _run:
    internal: true
    cmds:
      - '[ -x ./kotowari ] && ./kotowari {{.CLI}} || go run . {{.CLI}}'

  # --- quality ---

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run --fix
      - golangci-lint fmt

  test:
    desc: Run all Go tests
    deps: [test:unit]

  test:unit:
    desc: Go unit tests
    cmds:
      - go test -v -shuffle=on -race ./...

  test:scenario:
    desc: API scenario tests
    cmds:
      - go test -v -shuffle=on -race ./internal/httpapi -run Scenario

  check:
    desc: Lint and test everything (Go + SPA)
    cmds:
      - task: lint
      - task: test
      - task: web:check
      - task: web:test

  web:check:
    desc: Format, lint, and typecheck the SPA
    dir: web
    cmds:
      - pnpm exec vp check --fix

  web:test:
    desc: SPA unit tests
    dir: web
    cmds:
      - pnpm exec vp test

  web:e2e:
    desc: Playwright e2e against the embedded SPA
    deps: [build]
    dir: web
    env:
      CI: "true"
      E2E_KOTOWARI_BIN: "{{.TASKFILE_DIR}}/kotowari"
    cmds:
      - pnpm exec playwright test

  # --- build ---

  build:
    desc: Build kotowari binary with embedded SPA
    deps: [web:build]
    cmds:
      - go build -o kotowari .

  web:build:
    desc: Build SPA and copy into go:embed dist
    dir: web
    cmds:
      - pnpm exec vp build
      - rm -rf ../internal/webembed/dist
      - mkdir -p ../internal/webembed/dist
      - cp -a dist/. ../internal/webembed/dist/
